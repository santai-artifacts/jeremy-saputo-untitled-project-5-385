<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .game-board-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #f5f5f5;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            margin-bottom: 25px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .instructions {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            color: #555;
            line-height: 1.6;
        }

        .instructions strong {
            color: #333;
        }

        .game-over-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 250px;
        }

        .game-over-content h2 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .game-over-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .final-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.3em;
            font-weight: bold;
        }

        .game-over-content button {
            width: 100%;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            .btn-primary {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake</h1>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Length</div>
                <div class="stat-value" id="length">1</div>
            </div>
        </div>

        <div class="game-board-container">
            <canvas id="gameCanvas"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-content">
                    <h2>Game Over</h2>
                    <p>You hit a wall or yourself!</p>
                    <div class="final-score">
                        Final Score: <span id="finalScore">0</span>
                    </div>
                    <button class="btn-primary" onclick="resetGame()">Play Again</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="toggleGame()">Start Game</button>
            <button class="btn-secondary" onclick="resetGame()">Reset</button>
        </div>

        <div class="instructions">
            <strong>Controls:</strong> Use arrow keys or WASD to move the snake. Eat the red food to grow and gain points!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('score');
        const lengthDisplay = document.getElementById('length');
        const gameOverOverlay = document.getElementById('gameOverOverlay');

        // Game variables
        const gridSize = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let isGameRunning = false;
        let gameSpeed = 100;

        // Set canvas size
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            canvas.width = size;
            canvas.height = size;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Generate random food position
        function generateFood() {
            const cols = Math.floor(canvas.width / gridSize);
            const rows = Math.floor(canvas.height / gridSize);

            let newFood;
            let collision = true;

            while (collision) {
                newFood = {
                    x: Math.floor(Math.random() * cols) * gridSize,
                    y: Math.floor(Math.random() * rows) * gridSize
                };

                collision = snake.some(segment =>
                    segment.x === newFood.x && segment.y === newFood.y
                );
            }

            food = newFood;
        }

        // Draw game elements
        function draw() {
            const cols = Math.floor(canvas.width / gridSize);
            const rows = Math.floor(canvas.height / gridSize);

            // Clear canvas
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (subtle)
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#667eea';
                    ctx.shadowColor = 'rgba(102, 126, 234, 0.4)';
                    ctx.shadowBlur = 8;
                } else {
                    // Body
                    ctx.fillStyle = '#764ba2';
                    ctx.shadowColor = 'transparent';
                }

                ctx.fillRect(
                    segment.x + 1,
                    segment.y + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // Draw food
            ctx.shadowColor = 'rgba(231, 76, 60, 0.4)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.x + gridSize / 2,
                food.y + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            ctx.shadowColor = 'transparent';
        }

        // Update game state
        function update() {
            direction = nextDirection;

            // Calculate new head position
            const cols = Math.floor(canvas.width / gridSize);
            const rows = Math.floor(canvas.height / gridSize);

            let newHead = {
                x: (snake[0].x + direction.x * gridSize) % (cols * gridSize),
                y: (snake[0].y + direction.y * gridSize) % (rows * gridSize)
            };

            // Handle negative wrapping
            if (newHead.x < 0) newHead.x = (cols - 1) * gridSize;
            if (newHead.y < 0) newHead.y = (rows - 1) * gridSize;

            // Check collision with self
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            snake.unshift(newHead);

            // Check collision with food
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }

            lengthDisplay.textContent = snake.length;
        }

        // Game loop
        function gameLoop() {
            update();
            draw();

            if (isGameRunning) {
                setTimeout(gameLoop, gameSpeed);
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;

            const key = e.key.toLowerCase();

            // Arrow keys
            if (e.key === 'ArrowUp' && direction.y === 0) nextDirection = { x: 0, y: -1 };
            else if (e.key === 'ArrowDown' && direction.y === 0) nextDirection = { x: 0, y: 1 };
            else if (e.key === 'ArrowLeft' && direction.x === 0) nextDirection = { x: -1, y: 0 };
            else if (e.key === 'ArrowRight' && direction.x === 0) nextDirection = { x: 1, y: 0 };

            // WASD
            else if (key === 'w' && direction.y === 0) nextDirection = { x: 0, y: -1 };
            else if (key === 's' && direction.y === 0) nextDirection = { x: 0, y: 1 };
            else if (key === 'a' && direction.x === 0) nextDirection = { x: -1, y: 0 };
            else if (key === 'd' && direction.x === 0) nextDirection = { x: 1, y: 0 };

            e.preventDefault();
        });

        // Start/pause game
        function toggleGame() {
            isGameRunning = !isGameRunning;
            startBtn.textContent = isGameRunning ? '⏸ Pause' : '▶ Resume';

            if (isGameRunning) {
                gameOverOverlay.classList.remove('show');
                gameLoop();
            }
        }

        // Reset game
        function resetGame() {
            isGameRunning = false;
            snake = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreDisplay.textContent = score;
            lengthDisplay.textContent = snake.length;
            startBtn.textContent = '▶ Start Game';
            gameOverOverlay.classList.remove('show');
            generateFood();
            draw();
        }

        // End game
        function endGame() {
            isGameRunning = false;
            startBtn.textContent = '▶ Start Game';
            document.getElementById('finalScore').textContent = score;
            gameOverOverlay.classList.add('show');
        }

        // Initial draw
        generateFood();
        draw();
    </script>
</body>
</html>
